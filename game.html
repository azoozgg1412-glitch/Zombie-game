function mpApply(s){if(!ME||!ZVK.length)ZVK=Object.keys(ZV);

 let rb=false;

 bx.st=s.bx[0];bx.w=s.bx[1];bx.show=s.bx[2];bx.t=s.bx[3];pp2.st=s.pp[0];pp2.t=s.pp[1];pp2.i=s.pp[2];

   q.use=pj.u?{txt:pj.u[0],c:pj.u[1],hold:pj.u[2],desc:pj.u[3],go(){}}:null;use=q.use}
  else{const of=q.f;for(const k in pj)if(k!='u'&&k!='x'&&k!='y'&&k!='a')q[k]=pj[k];q.tx=pj.x;q.ty=pj.y;q.ta=pj.a;if(of!==pj.f||q.tx===undefined||D(q.x,q.y,pj.x,pj.y)>250){q.x=pj.x;q.y=pj.y;q.a=pj.a}}}
 for(const q of PL)if(!list.includes(q)&&q!==ME){}

 const keepIds=new Set(),nz=[];

function guestUpdate(dt){if(!ME)return;T+=dt;hmk-=dt;fadeT=Math.max(0,fadeT-dt);fl=Math.max(0,fl-dt*1.2);P=ME;
 for(const q of PL){q.fl-=dt;q.mel-=dt;q.dmgf-=dt;q.rc=Math.max(0,q.rc-dt*9);q.sc-=dt;if(q.rl>0)q.rl-=dt}
 let I=NOI;if(!ME.down&&state=='play'){I=localI(ME);if(I.a!=null)ME.a=I.a;movP(ME,I,dt);if(I.ck){NET.ck=1}M.click=0}
 const k=1-Math.exp(-dt*16);
 for(const q of PL){if(q===ME||q.tx===undefined)continue;q.x+=(q.tx-q.x)*k;q.y+=(q.ty-q.y)*k;q.a+=wa(q.ta-q.a)*k;if(!q.down&&D(q.x,q.y,q.tx,q.ty)>.5)q.wt+=dt*9}
 for(const z of Z){if(z.tx===undefined)continue;z.x+=(z.tx-z.x)*k;z.y+=(z.ty-z.y)*k;if(z.dead)z.dead+=dt}
 for(const b of Bu){b.x+=b.vx*dt;b.y+=b.vy*dt}for(const g2 of Gr){g2.x+=g2.vx*dt;g2.y+=g2.vy*dt;g2.t-=dt}for(const q of Pw)q.t-=dt;
 NET.I=I;fxTick(dt)}
